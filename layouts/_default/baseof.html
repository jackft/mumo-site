<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} — {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="content">
    <header>
      <a href="/" id="site-name" aria-label="mumo home"><img src="/mumo.png" alt="mumo" height="40"></a>
      <nav>
        <ul>
          {{ range site.Menus.main }}
          <li><a href="{{ .URL }}"{{ if strings.HasPrefix .URL "http" }} target="_blank" rel="noopener"{{ end }}{{ if eq $.RelPermalink .URL }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </nav>
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
  </div>
  <footer>
    <p><span class="sl-footer"><span class="sl-bracket">[</span><span class="sl-m">m</span><span class="sl-u sl-oblique">u</span><span class="sl-m sl-oblique">m</span><span class="sl-o sl-oblique">o</span><span class="sl-bracket">]</span></span> is free software under the <a href="https://opensource.org/licenses/MIT">MIT License</a>. Source on <a href="https://github.com/jackft/mumolia">GitHub</a>.</p>
  </footer>
</body>
</html>
